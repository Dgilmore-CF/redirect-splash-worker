name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        default: 'lab'
        options:
          - lab
          - simulation
          - production
      skip_tests:
        description: 'Skip tests'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'lab' }}
  cancel-in-progress: false

jobs:
  # -----------------------------------------------------------------
  # Validate before deploy
  # -----------------------------------------------------------------
  validate:
    name: Validate
    runs-on: ubuntu-latest
    if: ${{ ! inputs.skip_tests }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm test

  # -----------------------------------------------------------------
  # Deploy redirect-splash worker
  # -----------------------------------------------------------------
  deploy-splash:
    name: Deploy splash worker (${{ github.event.inputs.environment || 'lab' }})
    runs-on: ubuntu-latest
    needs: validate
    if: always() && (needs.validate.result == 'success' || needs.validate.result == 'skipped')
    environment:
      name: ${{ github.event.inputs.environment || 'lab' }}
      url: https://hr.dtg-lab.net/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy to ${{ github.event.inputs.environment || 'lab' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            deploy
            ${{ github.event.inputs.environment == 'production' && '--env production' || '' }}
            ${{ github.event.inputs.environment == 'simulation' && '--env simulation' || '' }}

      - name: Smoke test
        if: ${{ github.event.inputs.environment != 'simulation' }}
        run: |
          set -e
          for host in hr.dtg-lab.net fs.gmis.dtg-lab.net; do
            echo "Testing $host..."
            STATUS=$(curl -sk -o /dev/null -w "%{http_code}" "https://${host}/")
            if [ "$STATUS" != "200" ]; then
              echo "::warning::Got HTTP $STATUS for $host (expected 200)"
            else
              echo "  ✓ $host returned 200"
            fi
          done

  # -----------------------------------------------------------------
  # Deploy simulation worker (only when targeting lab/simulation)
  # -----------------------------------------------------------------
  deploy-simulation:
    name: Deploy simulation worker
    runs-on: ubuntu-latest
    needs: validate
    if: |
      always() &&
      (needs.validate.result == 'success' || needs.validate.result == 'skipped') &&
      (github.event.inputs.environment == 'simulation' || github.event.inputs.environment == 'lab' || github.event_name == 'push')
    environment:
      name: simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy simulation worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env simulation
